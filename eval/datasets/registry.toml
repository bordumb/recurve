# datasets/registry.toml — one pin per dataset, looked up by name instead of
# copy-pasted into every experiment manifest. Each entry here is copied
# byte-for-byte from the inline pin already committed in an experiment file
# (see the comment on each table) — `core/dataset_registry.py`'s own
# round-trip test proves a registry lookup returns the identical dict a
# manifest's inline `[tasks]` pin does today.
#
# Additive only: no experiment manifest is rewritten to reference this yet
# (three real manifests currently duplicate these pins inline: o6-smoke.toml,
# poc-bcb-hard.toml, runs/o6/manifest.toml) — this file gives a manifest the
# *option* to reference a name (`[tasks].dataset = "bigcodebench-hard"`)
# instead of repeating the pin, without requiring the existing, already-run
# manifests to change.

