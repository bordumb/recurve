[project]
name = "recurve-eval"
version = "0.1.0"
description = "The recurve evaluation pipeline — matrix as data. A separate uv project; recurvelib never imports it, so the engine's stdlib+PyYAML posture is untouched."
requires-python = ">=3.11"
# Core pipeline logic (plan/materialize/resume/analyze) is stdlib-only, so the
# gated claims run without the heavy fetch/oracle dependencies. Those live in
# optional groups, needed only for an actual paid run.
dependencies = []

[project.optional-dependencies]
run = ["datasets>=2.0"]        # fetch + pin the real benchmark from HuggingFace
oracle = ["bigcodebench"]      # build the quarantine venv for the hidden suites
figures = ["matplotlib>=3.6"]  # the deterministic figure renderer
swebench = ["swebench>=3.0", "docker>=7.0"]  # SWE-bench's own instance-building/grading tooling (SW1-SW3)

[project.scripts]
eval = "evallib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evallib"]
