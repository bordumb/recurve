site_name: recurve
site_description: Claims-driven recursive software improvement — point it at a repo or a PRD and burn down the gap between claimed and proven.
repo_url: https://github.com/bordumb/recurve
repo_name: bordumb/recurve

# Internal repo documents that must NOT be published or indexed on the site.
# plans/ holds the design spec (plan.md), the PRD (improvements.md), and the
# internal design docs — the designated provenance zone, in-repo only.
# research/ holds internal market/competitive notes — local-only (also gitignored).
exclude_docs: |
  plans/
  research/
  examples/

theme:
  name: material
  palette:
    # Dark Mode (default)
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light Mode
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs          # persistent top navbar — visible on the hero too
    - navigation.tabs.sticky   # keep the tabs pinned while scrolling
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html               # grid cards + the centered hero <div markdown>
  - pymdownx.emoji:          # :material-*: icons on the landing page
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - About: about.md
  - User guide:
      - Installation: user_guide/install.md
      - Usage:
          - Claude skill: user_guide/usage-claude-skill.md
          - Provider-agnostic: user_guide/usage-provider-agnostic.md
      - The claim graph: user_guide/claim-graph.md
      - Reports & status: user_guide/reports-and-status.md
      - Hardening your probes: user_guide/hardening.md
      - Run data & trajectories: user_guide/run-data.md
      - Multi-repo: user_guide/multi-repo.md
      - Claim packs: user_guide/packs.md
      - Fan-out search (fansearch): user_guide/fansearch.md
      - Exploring the unknown (explore): user_guide/explore.md
  - Developer guide:
      - The verification layer: developer_guide/verification-layer.md
      - Evidence & receipts: developer_guide/evidence.md
      - Architecture: developer_guide/architecture.md
  - Evaluation:
      - Why, how, methodology: evals/index.md
      - Running the evals: evals/running.md
      - Results: evals/results.md
