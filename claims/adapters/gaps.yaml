# gaps.yaml — the live ledger: verified observations only.
# Entries arrive here through `baseline` (the promotion ceremony); the
# `observed` field quotes actual dated output, never a prediction.

- id: AP-1
  title: the write boundary is enforced when a patch is applied to a real tree
  class: security-tradeoff
  status: closed
  severity: headline
  evidence:
  - probes/ap-1.sh:1
  observed: 'GREEN at baseline 2026-07-01: apply refuses a referee-surface patch (nothing
    written) and writes a target-tree patch'
  smallest_fix: GitWorld.apply checks within_boundary on every path before writing; refuses
    on violation.
  probe: probes/ap-1.sh
  unlocks: the live actor cannot edit its own probes/traps on disk

- id: AP-2
  title: checkpoint then restore rolls a real tree back
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/ap-2.sh:1
  observed: 'GREEN at baseline 2026-07-01: checkpoint then restore rolls the working tree
    back to the snapshot'
  smallest_fix: checkpoint commits and returns HEAD; restore does git reset --hard to it.
  probe: probes/ap-2.sh
  unlocks: STOP-REVERT actually undoes the actor changes on disk

- id: AP-3
  title: the actor is driven by the external command
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/ap-3.sh:1
  observed: 'GREEN at baseline 2026-07-01: actor returns the command''s parsed patch; empty
    stdout -> no change ({})'
  smallest_fix: CommandActor runs the command, feeds evidence on stdin, parses the JSON patch
    from stdout.
  probe: probes/ap-3.sh
  unlocks: a real (BYO) agent drives the loop through a stable seam

- id: AP-4
  title: the loop burns a real repo down and stops
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/ap-4.sh:1
  observed: 'GREEN at baseline 2026-07-01: live loop on a real repo: RED -> GREEN on disk,
    STOP-SUCCESS, referee untouched'
  smallest_fix: 'GitWorld + CommandActor compose under run(): apply writes, gate re-measures,
    controller stops.'
  probe: probes/ap-4.sh
  unlocks: the autonomous loop runs end to end on a real tree, not just a stub world

- id: AP-5
  title: a misbehaving agent surfaces as AgentError
  class: broken-route
  status: closed
  severity: headline
  evidence:
  - probes/ap-5.sh:1
  observed: 'GREEN at baseline 2026-07-01: malformed output and non-zero exit both -> AgentError;
    a clean empty run -> {} (no change)'
  smallest_fix: 'propose raises AgentError on non-zero exit or non-JSON/non-dict output; empty
    stdout on a clean run -> {}.

    '
  probe: probes/ap-5.sh
  unlocks: a malformed or crashed agent no longer kills the loop or hides as no-change (found
    by adversarial review)

- id: AP-6
  title: restore fails safe on an unknown sha
  class: broken-route
  status: closed
  severity: feature
  evidence:
  - probes/ap-6.sh:1
  observed: 'GREEN at baseline 2026-07-01: restore on an unknown sha -> RestoreError (the
    revert path fails in a catchable way)'
  smallest_fix: 'restore catches CalledProcessError and raises RestoreError.

    '
  probe: probes/ap-6.sh
  unlocks: a bad checkpoint cannot turn the safety-revert path into a crash (found by adversarial
    review)

- id: AP-7
  title: apply is atomic against write failures
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/ap-7.sh:1
  observed: 'GREEN at baseline 2026-07-01: a failed multi-key patch is rolled back: ''a''
    is absent after the raise (no partial mutation)'
  smallest_fix: 'apply records prior file state and rolls back written files if a later write
    raises.

    '
  probe: probes/ap-7.sh
  unlocks: a partly-failed patch never leaves the tree in a mixed state (found by adversarial
    review)

- id: AP-8
  title: the evidence serializer is total
  class: missing-surface
  status: closed
  severity: friction
  evidence:
  - probes/ap-8.sh:1
  observed: 'GREEN at baseline 2026-07-01: an object whose __str__ raises still serializes
    to a placeholder string'
  smallest_fix: '_jsonable wraps str(obj) in try/except and returns a placeholder on failure.

    '
  probe: probes/ap-8.sh
  unlocks: serializing the evidence never crashes propose before the agent runs (found by
    adversarial review)

- id: AP-9
  title: apply rolls back a created directory, not just files
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/ap-9.sh:1
  observed: 'GREEN at baseline 2026-07-01: a failed apply removes the directory it created:
    no orphan ''fresh/'' after rollback'
  smallest_fix: apply tracks dirs it creates and rmdirs them (deepest-first) on rollback.
  probe: probes/ap-9.sh
  unlocks: a failed apply leaves no orphan directories (found by adversarial review)

- id: AP-10
  title: apply overwrites a binary file without a decode crash
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/ap-10.sh:1
  observed: 'GREEN at baseline 2026-07-01: an in-bounds patch over a binary file applies cleanly
    (prior read as bytes)'
  smallest_fix: apply snapshots the prior as bytes (read_bytes), rolls back with write_bytes.
  probe: probes/ap-10.sh
  unlocks: an in-bounds patch over a binary file no longer crashes (found by adversarial review)

- id: AP-11
  title: checkpoint works on a repo with no configured identity
  class: broken-route
  status: closed
  severity: headline
  evidence:
  - probes/ap-11.sh:1
  observed: 'GREEN at baseline 2026-07-01: checkpoint succeeds on a repo with no configured
    user (identity supplied via -c)'
  smallest_fix: checkpoint commits with -c user.name/user.email so it does not depend on ambient
    config.
  probe: probes/ap-11.sh
  unlocks: the loop first action does not crash on an unconfigured host (found by adversarial
    review)

- id: AP-12
  title: a missing git binary is a typed error, not a raw crash
  class: broken-route
  status: closed
  severity: feature
  evidence:
  - probes/ap-12.sh:1
  observed: 'GREEN at baseline 2026-07-01: git missing on the revert path -> RestoreError
    (typed), not a raw FileNotFoundError'
  smallest_fix: _git wraps CalledProcessError/FileNotFoundError/TimeoutExpired into GitError;
    restore -> RestoreError.
  probe: probes/ap-12.sh
  unlocks: git-missing/timeout on the revert path fails typed

- id: AP-13
  title: a hanging agent times out
  class: broken-route
  status: closed
  severity: feature
  evidence:
  - probes/ap-13.sh:1
  observed: 'GREEN at baseline 2026-07-01: a command exceeding the timeout -> AgentError (the
    loop is not wedged by a hanging agent)'
  smallest_fix: CommandActor.propose passes timeout= and raises AgentError on TimeoutExpired.
  probe: probes/ap-13.sh
  unlocks: a hanging agent cannot wedge the loop (found by adversarial review)

- id: AP-14
  title: the evidence serializer is total for dataclasses too
  class: missing-surface
  status: closed
  severity: friction
  evidence:
  - probes/ap-14.sh:1
  observed: 'GREEN at baseline 2026-07-01: a recursive dataclass serializes to a placeholder
    string (asdict failure is caught)'
  smallest_fix: _jsonable wraps dataclasses.asdict in try/except, falling through to str.
  probe: probes/ap-14.sh
  unlocks: a recursive dataclass evidence cannot crash propose (found by adversarial review)

- id: AP-15
  title: a failed apply never leaves a mixed tree
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/ap-15.sh:1
  observed: 'GREEN at baseline 2026-07-01: a failed apply restores ''top'' fully — rollback
    completes despite the dir-collision on ''sub'''
  smallest_fix: rollback guards each step and only unlinks a file it wrote, not a pre-existing
    dir.
  probe: probes/ap-15.sh
  unlocks: a partly-failed patch always rolls back fully (found by adversarial review)

- id: AP-16
  title: a symlinked prefix cannot escape the tree
  class: security-tradeoff
  status: closed
  severity: headline
  evidence:
  - probes/ap-16.sh:1
  observed: 'GREEN at baseline 2026-07-01: a symlinked prefix escape is refused (BoundaryViolation);
    nothing written outside the tree'
  smallest_fix: apply resolves the parent chain and refuses a write whose resolved parent
    is outside root.
  probe: probes/ap-16.sh
  unlocks: the write boundary holds against symlink escapes (found by adversarial review)

- id: AP-17
  title: a command that cannot be run is a typed error
  class: broken-route
  status: closed
  severity: feature
  evidence:
  - probes/ap-17.sh:1
  observed: 'GREEN at baseline 2026-07-01: a not-found agent command -> AgentError (typed),
    not a raw FileNotFoundError'
  smallest_fix: propose catches OSError (incl. FileNotFoundError) -> AgentError.
  probe: probes/ap-17.sh
  unlocks: a mistyped agent argv fails typed

- id: AP-18
  title: checkpoint fails typed, symmetric with restore
  class: broken-route
  status: closed
  severity: feature
  evidence:
  - probes/ap-18.sh:1
  observed: 'GREEN at baseline 2026-07-01: git missing on the snapshot path -> CheckpointError
    (typed), symmetric with RestoreError'
  smallest_fix: checkpoint wraps GitError into CheckpointError.
  probe: probes/ap-18.sh
  unlocks: the snapshot path fails typed like the revert path (found by adversarial review)
