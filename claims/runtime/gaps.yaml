- id: RT-3
  title: Sense feeds divergence so a green-but-diverged cycle does not stop
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/rt-3.sh:1
  observed: 'GREEN at baseline 2026-07-01: green-but-diverged cycle: divergent=True, decide
    != STOP-SUCCESS (intent breach blocks the stop)'
  smallest_fix: 'sense sets Progress.divergent from fidelity.divergent(goal_counterexamples).

    '
  probe: probes/rt-3.sh
  unlocks: A3 — green probes cannot buy a success-stop when intent was broken

- id: RT-4
  title: the write boundary keeps the actor off the referee surface
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/rt-4.sh:1
  observed: 'GREEN at baseline 2026-07-01: target-only diff accepted; a probe-editing diff
    and an outside diff both rejected'
  smallest_fix: 'within_boundary requires every diff path under target_root and under no referee_root.

    '
  probe: probes/rt-4.sh
  unlocks: A4 — an autonomous actor cannot weaken the test it is graded by

- id: RT-5
  title: the capture rule only accepts a discriminating trap
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/rt-5.sh:1
  observed: 'GREEN at baseline 2026-07-01: capture accepts only a discriminating trap (RED
    on wrong, GREEN on real)'
  smallest_fix: 'capture returns trap_red_on_wrong AND trap_green_on_real.

    '
  probe: probes/rt-5.sh
  unlocks: A5 — an adversary objection becomes evidence only when it discriminates

- id: RT-6
  title: the actor is reached only on an admitted contract
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/rt-6.sh:1
  observed: 'GREEN at baseline 2026-07-01: ADMIT -> actor invoked; non-ADMIT -> actor never
    called, returns None'
  smallest_fix: 'guarded_propose returns None unless admitted(report) is true.

    '
  probe: probes/rt-6.sh
  unlocks: A6 — a non-ADMIT contract is never burned down

- id: RT-7
  title: Sense reads the gate counts straight through
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/rt-7.sh:1
  observed: 'GREEN at baseline 2026-07-01: Sense passes the gate counts through: open=1, regressed=2,
    broken=3'
  smallest_fix: sense sets open/regressed/broken from gate_counts, not a constant.
  probe: probes/rt-7.sh
  unlocks: a RED world can never be sensed green through a hardcoded gate field (found by
    adversarial review)

- id: RT-8
  title: the boundary checks every diff path, not just the first
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/rt-8.sh:1
  observed: 'GREEN at baseline 2026-07-01: a diff touching the referee surface anywhere in
    the list is rejected (all paths checked)'
  smallest_fix: within_boundary iterates every path; any referee-touching path rejects the
    diff.
  probe: probes/rt-8.sh
  unlocks: an actor cannot smuggle a probe edit beside a clean file (found by adversarial
    review)

- id: RT-9
  title: a diff path escaping via .. or absolute is rejected
  class: security-tradeoff
  status: closed
  severity: headline
  evidence:
  - probes/rt-9.sh:1
  observed: 'GREEN at baseline 2026-07-01: ''..'' and absolute paths are rejected; a normal
    target-tree path still passes'
  smallest_fix: within_boundary rejects absolute paths and normalizes, rejecting any .. that
    climbs out.
  probe: probes/rt-9.sh
  unlocks: the write boundary cannot be escaped by path traversal (a real bug, now fixed)

- id: RT-10
  title: the guard refuses every non-ADMIT verdict
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/rt-10.sh:1
  observed: 'GREEN at baseline 2026-07-01: REFUSE-AND-INTERVIEW contract: actor never called,
    guard returns None'
  smallest_fix: guarded_propose keys on admitted() (the ADMIT verdict), not the probe-able
    count.
  probe: probes/rt-10.sh
