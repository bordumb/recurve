# gaps.yaml — the live ledger: verified observations only.
# Entries arrive here through `baseline` (the promotion ceremony); the
# `observed` field quotes actual dated output, never a prediction.

- id: RT-1
  title: the loop stops by the gate, never the actor word
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/rt-1.sh:1
  observed: 'GREEN at baseline 2026-07-01: fixing actor -> STOP-SUCCESS + world green; lying
    actor -> never STOP-SUCCESS (verdict from the gate)'
  smallest_fix: 'run computes the verdict from world.gate() via decide(); the actor''s output
    is only applied as a diff.

    '
  probe: probes/rt-1.sh
  unlocks: A1 — an autonomous loop you can trust because the trust lives in the gate, not
    the actor

