- id: RT-11
  title: the last-green floor is only a fully-clean cycle
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/rt-11.sh:1
  observed: 'GREEN at baseline 2026-07-01: revert restores the initial clean floor (cycle
    0), never the regressed cycle 1'
  smallest_fix: run checkpoints last_green only when open == regressed == broken == 0.
  probe: probes/rt-11.sh
  unlocks: STOP-REVERT never restores a regressed state (found by adversarial review)

- id: RT-12
  title: STOP-REVERT restores the last-green snapshot, not the current state
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/rt-12.sh:1
  observed: 'GREEN at baseline 2026-07-01: revert restores the cycle-0 green floor, not the
    current (cycle 3) state'
  smallest_fix: run calls world.restore(last_green), not world.restore(world.checkpoint()).
  probe: probes/rt-12.sh
  unlocks: revert rolls back the damage instead of leaving it in place (found by adversarial
    review)

