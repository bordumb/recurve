  smallest_fix: 'skip underscore-prefixed functions/methods and the methods of underscore-prefixed
    classes.

    '
  probe: probes/cl-8.sh
  unlocks: the frontier never demands a claim for an implementation detail

- id: CL-9
  title: surface extraction is deterministic
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/cl-9.sh:1
  observed: 'GREEN at baseline 2026-06-30: deterministic: identical sorted sequence across
