- id: CL-17
  title: 'declared is not measured: an unexercised point is not covered'
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/cl-17.sh:1
  observed: 'GREEN at baseline 2026-06-30: target_b was never exercised, so it is not measured
    as covered (a claim cannot just declare it)'
  smallest_fix: 'measure_coverage returns only functions actually called, so an unexercised
    surface point is absent.

    '
  probe: probes/cl-17.sh
  unlocks: a claim can no longer earn coverage it does not exercise — the gameable gap in
    declared coverage, closed

