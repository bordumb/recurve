- id: ST-6
  title: the best item is not pivoted away pointlessly
  class: missing-surface
  status: closed
  severity: feature
  evidence:
  - probes/st-6.sh:1
  observed: 'GREEN at baseline 2026-06-30: stalled but already on the best item -> CONTINUE
    (no pointless pivot)'
  smallest_fix: 'pick_next returns (CONTINUE, current) when the stalled current item is already
