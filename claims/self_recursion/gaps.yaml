  - recurvelib/cli.py
  observed: 'GREEN at baseline 2026-07-01: materialized workflow is fully interpolated — no
    placeholder survives; runnable under bash'
  smallest_fix: materialize_workflow interpolates the shipped template (PROG/CAP/MAX_FAILS/RUNAWAY/
