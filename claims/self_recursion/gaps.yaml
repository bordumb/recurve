- id: SR-2
  title: the self-host gate is greenable — a declared oracle_waiver skips, an undeclared skip
    still blocks
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - SR-2
  evidence:
  - recurvelib/conformance.py
  - recurvelib/probe.py
  - claims/toolkit/gaps.yaml
  observed: 'GREEN at baseline 2026-07-01: a declared oracle_waiver honors a skip (non-blocking);
    an undeclared skip still blocks'
  smallest_fix: a probe may exit 3 (SKIP) when its external oracle is absent; conformance.is_waived_skip
    honors it as non-blocking ONLY when the claim declares an oracle_waiver, else it counts
    as broken; TK-2 declares the waiver, so the self-host gate is green while the ancestors
    are absent — without letting any probe dodge the gate by exiting 3
  probe: probes/sr-2.sh
  unlocks: 'a green self-host gate, so recurve run gets past preflight and the loop can execute
    on its own repo — the rest of #5, and the door to building #4 with the loop'

