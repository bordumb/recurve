- id: EV-7
  title: 'Gated-run outcome classifier: refusal vs process-failure'
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - EV-7
  evidence:
  - eval/evallib/classify.py
  observed: 'GREEN at close 2026-07-05: classify_gated_run splits declared / gate_refused /
    process_failed from (workspace, terminal_state) at every boundary'
  smallest_fix: classify_gated_run(workspace, terminal_state) returns process_failed on no
