  evidence:
  - eval/evallib/quarantine.py
  observed: 'GREEN at close 2026-07-05: oracle grades in the configured isolated interpreter
    (RECURVE_ORACLE_PYTHON), tamper-refused, sys.executable fallback'
  smallest_fix: quarantine.oracle_python() returns RECURVE_ORACLE_PYTHON or sys.executable and
