- id: EV-22
  title: Grading concurrency that cannot corrupt a verdict
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - EV-22
  evidence:
  - eval/evallib/grade_policy.py
  - eval/evallib/oracle_env.py
  - eval/evallib/cli.py
  observed: 'GREEN at close 2026-07-05: grading concurrency: matches the lock; a timeout gets ONE
    genuinely-exclusive serial retry (rc==124 only); a failure is never retried'
  smallest_fix: grade_policy.RWLock gives the timeout retry a genuinely contention-free window
    (normal grades take read, the retry takes write and drains in-flight work), so the retry is
    verdict-independent and grade_concurrency can sit in the lock outside the identity; the retry
    fires on rc==124 only (a failure mentioning "timeout" is not retried); assert_concurrency_matches
    refuses a run whose concurrency differs from the lock; cmd_run enforces the match + wraps the grader
  probe: probes/ev-22.sh
  unlocks: the paid run can parallelize grading for wall-clock without a contention-induced
    timeout ever becoming a false oracle error — speed never corrupts a verdict

