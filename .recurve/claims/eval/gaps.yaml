# `observed` field quotes actual dated output, never a prediction.

- id: EV-1
  title: TaskStore pins the benchmark to a content hash
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - EV-1
  evidence:
  - eval/evallib/taskstore.py
  observed: 'GREEN at baseline 2026-07-04: OK ⏎ taskstore pins to a content hash, reports
    count, and detects tampering (real HF fetch oracle-waived: datasets absent)'
  smallest_fix: taskstore.load_jsonl/content_hash/verify_pin pin a task set to a deterministic
    SHA-256 over canonical content and reject a tampered dataset against its pin
  probe: probes/ev-1.sh
  unlocks: every downstream number is anchored to an immutable, verifiable benchmark revision
  oracle_waiver: fetching the real BigCodeBench-Hard revision from HuggingFace needs the optional
    datasets dependency; the pinning logic is tested hermetically against a fixture, and the
    real fetch runs full-strength where datasets is importable

- id: EV-2
  title: Materializer builds A0/A3 workspaces and quarantines the oracle
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - EV-2
  evidence:
  - eval/evallib/materialize.py
  - eval/evallib/arms.py
  observed: 'GREEN at baseline 2026-07-04: OK ⏎ materializer builds A0/A3 workspaces and quarantines
    the hidden test'
  smallest_fix: arm_spec maps A0/A3 to their workspace specs; materialize builds a git-init'd
    workspace (A0 bare, A3 recurve-init'd) writing only the task statement + empty solution.py;
    assert_quarantined refuses any workspace containing the hidden test text
  probe: probes/ev-2.sh
  unlocks: the held-out oracle can never leak into an agent's workspace — the precondition
    for every honest FDR number

- id: EV-3
  title: 'Runner: pinned matrix + resumable work queue'
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - EV-3
  evidence:
  - eval/evallib/plan.py
  - eval/evallib/runner.py
  - eval/evallib/adapters
  observed: 'GREEN at baseline 2026-07-04: runner expands a pinned matrix, seals one row per
    cell, and resumes with zero new invocations'
  smallest_fix: plan.expand writes a deterministic cross-product matrix with coordinate-derived
    cell ids; runner.run seals one row per cell and resumes by skipping sealed ids, so a re-run
    over a completed matrix invokes the agent zero times
  probe: probes/ev-3.sh
  unlocks: an interrupted run resumes safely and re-running is always free — the precondition
    for a long, expensive matrix

