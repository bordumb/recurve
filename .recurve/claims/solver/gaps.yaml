# gaps.yaml — the live ledger: verified observations only.
# Entries arrive here through `baseline` (the promotion ceremony); the
# `observed` field quotes actual dated output, never a prediction.

- id: SOLV-1
  title: CLOSE is tried before DECOMPOSE
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  evidence:
  - probes/solv-1.sh:1
  observed: 'GREEN at baseline 2026-07-08: close_attempt alone resolved ROOT — cut_proposer
    was never consulted'
  smallest_fix: 'solve() tries ctx.close_attempt before ctx.cut_proposer; a successful close
    never consults the proposer at all.

    '
  probe: probes/solv-1.sh
  unlocks: the cheap-first cost order from §2.2 actually holds in the implementation

- id: SOLV-2
  title: decompose recurses through every leaf and root-completion closes the root
  class: missing-surface
  status: closed
  severity: headline
  reads: none
  evidence:
  - probes/solv-2.sh:1
  observed: 'GREEN at baseline 2026-07-08: one solve() call closed both leaves and root-completion
    closed ROOT'
  smallest_fix: 'One solve() call arms the assembly, recurses into every leaf via close_attempt,
    and close_upward propagates the closures back to the root — zero calls in between.

    '
  probe: probes/solv-2.sh
  unlocks: the Phase 2 acceptance bar (zero human turns between leaves) as a permanent, fast
    regression guard

- id: SOLV-3
  title: root-completion never fires on a partial child set
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  evidence:
  - probes/solv-3.sh:1
  observed: 'GREEN at baseline 2026-07-08: correctly NOT ready — LEAF-2 hasn''t closed (or
    even been armed) yet'
  smallest_fix: '_ready_to_assemble checks EVERY expected child (cut_proposer''s leaves +
    assembly id), not ledger.children_of, which only sees whichever children have reached
    the ledger so far.

    '
  probe: probes/solv-3.sh
  unlocks: root-completion cannot fire a doomed assembly attempt mid-recursion

