- id: SUFF-1
  title: the pin call threads explicit free variables before hypotheses
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  evidence:
  - probes/suff-1.sh:1
  observed: 'GREEN at baseline 2026-07-08: pin call threads explicit_args before hypothesis
    names'
  smallest_fix: '_check_source''s call line applies cut.theorem_name to cut.explicit_args
    before the leaves'' hypothesis names, in declaration order.

    '
  probe: probes/suff-1.sh
  unlocks: a sufficiency pin never mismatches an auto-generalized explicit variable slot

