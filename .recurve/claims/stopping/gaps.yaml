- id: ST-7
  title: a cycle that is not truly green never stops with success
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/st-7.sh:1
  observed: 'GREEN at baseline 2026-06-30: broken/regressed/divergent cycles all refuse STOP-SUCCESS
    (no false ''done'')'
  smallest_fix: 'decide() requires broken==0, regressed==0, and not divergent (as well as
    open==uncovered==0) for STOP-SUCCESS.

    '
  probe: probes/st-7.sh
