# gaps.yaml — the live ledger: verified observations only.
# Entries arrive here through `baseline` (the promotion ceremony); the
# `observed` field quotes actual dated output, never a prediction.

- id: ST-1
  title: a fully-green cycle stops with success
  class: missing-surface
  status: closed
  severity: headline
  evidence:
  - probes/st-1.sh:1
  observed: 'GREEN at baseline 2026-06-30: a fully-green cycle -> STOP-SUCCESS'
  smallest_fix: 'decide() returns STOP-SUCCESS when the latest cycle has open==regressed==broken==uncovered==0
    and is not divergent.

    '
  probe: probes/st-1.sh
  unlocks: the agent stops at done instead of running past it (the core 'cannot stop' failure,
    closed)

- id: ST-2
