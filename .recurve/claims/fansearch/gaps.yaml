- id: FS-1
  title: the proxy sanity check recognizes real dissipative structure
  class: missing-surface
  status: closed
  severity: headline
  reads: none
  covers:
  - FS-1
  observed: 'GREEN at baseline 2026-07-06: GREEN: dphi_dt matches the closed-form identity
    on 7 vectors; dissipative avg score 1.000, worst violating score 0.000'
  smallest_fix: add probes/fs-1_impl/proxy_sanity.py exposing dphi_dt(nu, alpha, gamma, N,
    u) and score(nu, alpha, gamma, N, u) that compute the shell-model weighted-energy derivative
    via the closed-form telescoping identity (lam=2), correct against the fixed vector table
    probes/fs-1.sh checks.
  probe: probes/fs-1.sh
  unlocks: every later fan-out claim -- the discovery engine is not worth building until this
    scorer can tell real dissipative structure from an impostor.

