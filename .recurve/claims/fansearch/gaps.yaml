- id: FS-4
  title: compile_to_claim's output elaborates through the real sibling gate -- the promotion
    bridge, automated
  class: missing-surface
  status: closed
  severity: headline
  reads: none
  covers:
  - FS-4
  observed: 'GREEN at baseline 2026-07-06: GREEN: compile_to_claim''s output elaborates and
    is kernel-clean against the real sibling gate; its own trap is correctly rejected'
  smallest_fix: add recurvelib/adapters/proxy/compile_to_claim.py (ClaimDraft, compile_to_claim)
    turning a Candidate into a named Lean theorem + pin + trap, specializing shell_single_active_dissipative
    (SH7) to the candidate's concrete numbers.
  probe: probes/fs-4.sh
  unlocks: the automated half of the promotion bridge (F0 Stage 3 proved it by hand); a real
    campaign can now turn a survivor into a gate-checked claim without a human writing the
    Lean.
  oracle_waiver: the sibling navier_stokes repo's default checkout does not have SH7 merged
    onto its main branch yet (it landed on a feature branch there, matched to this one) --
    the probe walks up to find a sibling navier_stokes/ and SKIPs (non-blocking) when SH7
    is not present there, exactly the AB-12/TK-2 pattern. $NAVIER_STOKES_REPO overrides the
    lookup for a real run.

- id: FS-5
  title: drill --fansearch measures a proxy's known-good/known-bad separation and fails on
    a regression
  class: missing-surface
  status: closed
  severity: feature
  reads: none
  covers:
  - FS-5
  observed: 'GREEN at baseline 2026-07-06: GREEN: proxy correctly separates 2 known-good
    and 3 known-bad candidates at threshold 0.6. (An earlier version of this probe also
    re-invoked `recurve drill --fansearch` as a CLI sanity check; that recursively acquired
    the tree lock this probe''s own caller already holds and was removed -- the direct-import
    check above exercises the identical cmd_drill logic.)'
  smallest_fix: 'add a --fansearch flag to recurve drill: for each registered ProxyEvaluator
    (besides "off") exposing DRILL_KNOWN_GOOD/DRILL_KNOWN_BAD/DRILL_THRESHOLD on its own module,
    measure false-negative/false-positive rate and fail the drill on any leak.'
  probe: probes/fs-5.sh
  unlocks: F6's anti-reward-hack teeth for the proxy itself -- a regression in the dyadic_lyapunov
    proxy's discriminative power is now caught mechanically, not just assumed from the Stage
    0-2 validation staying true forever.

