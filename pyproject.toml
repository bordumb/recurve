[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recurve"
dynamic = ["version"]
description = "Claims-driven recursive software improvement — turn a spec or README into machine-checkable promises, then let an agent loop build until every promise is proven."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bordumb" }]
keywords = [
  "agents",
  "autonomous-development",
  "claims",
  "verification",
  "testing",
  "evidence",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6.0", "typer>=0.12"]
# Runtime SYSTEM requirement (not a Python package, so not installable here): `git` must be on PATH for the
# git-backed features — receipts, `init` scaffolding, and the GitWorld runtime adapter. When git is absent
# recurve raises a typed error (never a raw crash); see the adapters suite (AP-12).

[project.optional-dependencies]
docs = ["mkdocs>=1.5", "mkdocs-material>=9"]   # the published site (mkdocs.yml); material pulls pymdown-extensions

[project.urls]
Homepage = "https://github.com/bordumb/recurve"
Repository = "https://github.com/bordumb/recurve"
Issues = "https://github.com/bordumb/recurve/issues"

[project.scripts]
recurve = "recurvelib.cli:main"

# Version is single-sourced from the engine itself.
[tool.hatch.version]
path = "recurvelib/__init__.py"
pattern = '^ENGINE_VERSION = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["recurvelib"]

# The engine's shipped resource trees (templates `init` stamps, the versioned
# schemas, the claim packs) ride inside the package; recurvelib.resource_dir()
# resolves them here in an installed wheel and beside recurvelib/ in a source
# checkout.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "recurvelib/_assets/templates"
"schema" = "recurvelib/_assets/schema"
"packs" = "recurvelib/_assets/packs"

# Explicit allowlist: the sdist carries the engine and its resources only.
# docs/plan.md (the design spec and designated provenance zone) and the
# self-host suite stay in the repo, out of the distribution.
[tool.hatch.build.targets.sdist]
include = [
  "/recurvelib",
  "/templates",
  "/schema",
  "/packs",
  "/README.md",
  "/pyproject.toml",
]
